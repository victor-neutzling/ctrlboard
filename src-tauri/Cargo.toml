[package]
name = "ctrlboard"
version = "0.1.0"
description = "A tactile desktop control panel"
authors = ["you"]
edition = "2021"

[lib]
name = "ctrlboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2.8.4", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
